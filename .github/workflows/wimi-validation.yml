name: WIMI foundation validation

on:
  push:
    branches:
      - feat/wimi-001-003-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: wimi-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: taxi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: taxi/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build Taxi
        run: npm run build:taxi

      - name: Build WIMI
        run: npm run build:wimi

      - name: Run Jest
        env:
          CI: "true"
        run: npm run test:nix -- --runInBand

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run live-backend Playwright suite
        env:
          CI: "true"
          E2E_DRIVER_LOGIN: ${{ secrets.E2E_DRIVER_LOGIN }}
          E2E_DRIVER_PASSWORD: ${{ secrets.E2E_DRIVER_PASSWORD }}
          E2E_DRIVER_TYPE: ${{ secrets.E2E_DRIVER_TYPE }}
          E2E_DRIVER2_LOGIN: ${{ secrets.E2E_DRIVER2_LOGIN }}
          E2E_DRIVER2_PASSWORD: ${{ secrets.E2E_DRIVER2_PASSWORD }}
          E2E_DRIVER2_TYPE: ${{ secrets.E2E_DRIVER2_TYPE }}
          E2E_PASSENGER_LOGIN: ${{ secrets.E2E_PASSENGER_LOGIN }}
          E2E_PASSENGER_PASSWORD: ${{ secrets.E2E_PASSENGER_PASSWORD }}
          E2E_PASSENGER_TYPE: ${{ secrets.E2E_PASSENGER_TYPE }}
          E2E_API_BASE: ${{ secrets.E2E_API_BASE }}
        shell: bash
        run: |
          required=(E2E_DRIVER_LOGIN E2E_DRIVER_PASSWORD E2E_DRIVER2_LOGIN E2E_DRIVER2_PASSWORD E2E_PASSENGER_LOGIN E2E_PASSENGER_PASSWORD)
          missing=()
          for key in "${required[@]}"; do
            if [[ -z "${!key}" ]]; then missing+=("$key"); fi
          done
          if (( ${#missing[@]} )); then
            echo "::warning::Playwright E2E not run: missing dedicated test-account secrets: ${missing[*]}. This suite mutates live backend orders."
            exit 0
          fi
          npm run test:e2e

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wimi-validation-reports
          path: |
            taxi/e2e-results/
            taxi/build/
            taxi/build-wimi/
          if-no-files-found: ignore
          retention-days: 7
